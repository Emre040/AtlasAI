name: Backend deploy

on:
  push:
    branches:
      - main
    paths:
      - Backend/**
      - .github/workflows/backend-deploy.yml

permissions:
  contents: read

concurrency:
  group: atlas-backend-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm test
      - name: Check JavaScript syntax
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -path './node_modules' -prune -o -type f \( -name '*.js' -o -name '*.cjs' \) -print0)

  deploy:
    needs: test
    if: ${{ vars.ATLAS_BACKEND_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Queue exact backend release
        env:
          DEPLOY_SECRET: ${{ secrets.ATLAS_DEPLOY_WEBHOOK_SECRET }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_REF: ${{ github.ref }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          payload="$(node -e 'process.stdout.write(JSON.stringify({repository: process.env.DEPLOY_REPOSITORY, ref: process.env.DEPLOY_REF, sha: process.env.DEPLOY_SHA}))')"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header 'content-type: application/json' \
            --header "x-deploy-secret: ${DEPLOY_SECRET}" \
            --data "${payload}" \
            'https://p9000.greenaurem.org/deploy/github'

      - name: Wait for production health verification
        env:
          DEPLOY_SECRET: ${{ secrets.ATLAS_DEPLOY_WEBHOOK_SECRET }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The API restarts while the release switches, so a poll can briefly get a 502 from
          # Cloudflare; that is not a verdict. Only a 200 body decides, and only its state.
          for _ in $(seq 1 90); do
            body="$(curl --silent --output - --write-out '\n%{http_code}' \
              --header "x-deploy-secret: ${DEPLOY_SECRET}" \
              "https://p9000.greenaurem.org/deploy/github/${DEPLOY_SHA}" || true)"
            code="${body##*$'\n'}"
            payload="${body%$'\n'*}"
            if [[ "${code}" == '200' ]]; then
              state="$(node -e 'try { const value = JSON.parse(process.argv[1]); process.stdout.write(typeof value.state === "string" ? value.state : ""); } catch { process.stdout.write(""); }' "${payload}")"
              if [[ "${state}" == 'succeeded' ]]; then
                exit 0
              fi
              if [[ "${state}" == 'failed' ]]; then
                echo "release reported failed: ${payload}"
                exit 1
              fi
            else
              echo "status endpoint returned HTTP ${code:-none}; retrying"
            fi
            sleep 10
          done
          echo "release did not report success within 15 minutes"
          exit 1
